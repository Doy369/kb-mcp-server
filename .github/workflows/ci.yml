name: CI

# 每次 PR / 主干推送都跑：单测 → 回归评测。
# 关键在最后一步——评测通过率低于基线时 CI 变红，**卡住合并**。
# 这样“我改完效果变好了”就不再是主观判断，而是流水线上的一个布尔值。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单测 + 回归评测（离线）
    runs-on: ubuntu-latest

    env:
      # 只装离线依赖：memory 后端 + dev 嵌入 + 确定性编排，零外部服务
      KB_STORAGE_BACKEND: memory
      KB_EMBEDDING_BACKEND: dev
      KB_GRAPH_BACKEND: memory
      KB_GRAPH_ENABLED: "1"
      KB_LLM_ENABLED: "0"
      KB_AGENT_MODE: deterministic
      KB_API_MOCK: "1"
      KB_AUDIT_LOG: "off"
      KB_CHUNK_STRATEGY: fine

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（仅离线必需项）
        run: |
          python -m pip install --upgrade pip
          # 不装 sentence-transformers / psycopg / pgvector —— CI 保持快且零外部依赖。
          # 这些只在 bge / pgvector 模式下才需要，由本地或专门的 job 验证。
          pip install pytest pydantic python-dotenv "mcp<2" numpy rank-bm25

      # ------------------------------------------------------------------ #
      # 1) 单测：分层覆盖数据 / 检索 / 评测 / 护栏 / Agent / 降级
      # ------------------------------------------------------------------ #
      - name: 运行单测
        run: python -m pytest tests/ -v --tb=short

      # ------------------------------------------------------------------ #
      # 2) 回归评测：跑 golden 集，产出可对比的基线指标
      #    eval_run.py 自建独立 store，每次重新播种，结果可复现。
      # ------------------------------------------------------------------ #
      - name: 运行回归评测
        run: python eval_run.py

      - name: 校验评测基线（通过率不得低于阈值）
        run: python scripts/check_baseline.py

      # ------------------------------------------------------------------ #
      # 3) 归档产物：报告随 CI 运行留痕，便于事后对比与面试展示
      # ------------------------------------------------------------------ #
      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval_report.json
            kb_store_eval.json
          retention-days: 30
          if-no-files-found: warn

  # ------------------------------------------------------------------ #
  # 2) 容器镜像：构建 + 冒烟
  #
  # 为什么需要这一步：Dockerfile / docker-compose.yml 长期「已提交但从未构建过」
  # （开发机无 docker daemon，只做过 compose 语法校验）——「镜像能构建」一直是
  # 未验证假设。更关键的是 **docker build 成功 ≠ 容器能跑**：
  #   · build 只执行 pip install，不会 import 项目代码；
  #   · 缺依赖（如 rank_bm25）不会让 build 失败，而是让容器**启动后静默降级**。
  # 因此这里既构建、又真实启动并探活，还做一次容器内依赖自检。
  # ------------------------------------------------------------------ #
  docker:
    name: 容器镜像（构建 + 冒烟）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建镜像（默认轻量档）
        run: docker build -t kb-mcp-server:ci .

      - name: 启动容器并等待健康检查
        run: |
          docker run -d --name kb -p 8000:8000 kb-mcp-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "[OK] 容器健康检查通过（第 $i 次尝试）"
              exit 0
            fi
            sleep 2
          done
          echo "[FAIL] 容器 60s 内未就绪。容器状态："
          docker ps -a
          echo "---- 容器日志 ----"
          docker logs kb 2>&1 | tail -40
          exit 1

      - name: 探关键接口
        run: |
          echo "--- /healthz ---"
          curl -fsS http://127.0.0.1:8000/healthz; echo
          echo "--- /api/status ---"
          curl -fsS http://127.0.0.1:8000/api/status | head -c 400; echo

      - name: 容器内依赖自检（防止核心检索链路静默降级）
        run: |
          docker exec kb python -c "import rank_bm25, numpy, pypdf, mcp, pydantic, dotenv; print('[OK] 核心依赖齐备：rank_bm25 / numpy / pypdf / mcp / pydantic / dotenv')"

      - name: 容器内跑一次真实问答（端到端冒烟）
        run: |
          docker exec kb python -c "import urllib.request, json; req = urllib.request.Request('http://127.0.0.1:8000/api/ask', data=json.dumps({'question': '如何申请退货'}).encode(), headers={'Content-Type': 'application/json'}); d = json.loads(urllib.request.urlopen(req, timeout=30).read()); print('[OK] /api/ask 返回 confidence =', (d.get('confidence') or {}).get('score')); print('[OK] synthesis_method =', d.get('synthesis_method'))"

      - name: 失败时导出容器日志
        if: failure()
        run: docker logs kb 2>&1 | tail -50 || true

      - name: 清理容器
        if: always()
        run: docker rm -f kb || true

  # ------------------------------------------------------------------ #
  # 3) 生产存储：真实 Postgres + pgvector
  #
  # 为什么需要这一步：pgvector 后端长期只做到「代码就位」——从未在真实 PG 上
  # 跑过，因为开发机没有 docker daemon，起不了库。于是「生产存储能通」一直是
  # 未验证假设。这里用 service container 拉起 pgvector/pgvector:pg16，跑
  # setup_db.py 建表 + 完整回归评测，把假设变成流水线上的绿勾。
  #
  # 关键：光看「评测通过」不足以证明存储生效——存储连不上时代码会走降级分支，
  # 评测照样跑在 memory 上而 CI 全绿。所以最后两步专门校验 schema 落库、且
  # kb_chunks 里确有数据，把「静默退回」变成硬失败。
  #
  # 注：该镜像不含 Apache AGE，--graph 会按设计降级为 memory 图（不阻断，
  #     AGE 生产图的能力由本地带扩展的环境单独验证）。
  # ------------------------------------------------------------------ #
  pg:
    name: 生产存储（真实 PG + pgvector）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # 与 test job 唯一的区别：存储后端换成真实 PG
      KB_STORAGE_BACKEND: pgvector
      KB_DATABASE_URL: postgresql://kb:kb@localhost:5432/kb
      KB_EMBEDDING_DIM: "1024"
      KB_EMBEDDING_BACKEND: dev
      KB_GRAPH_BACKEND: memory
      KB_GRAPH_ENABLED: "1"
      KB_LLM_ENABLED: "0"
      KB_AGENT_MODE: deterministic
      KB_API_MOCK: "1"
      KB_AUDIT_LOG: "off"
      KB_CHUNK_STRATEGY: fine

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（含 PG 驱动）
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic python-dotenv "mcp<2" numpy rank-bm25 pypdf "psycopg[binary]" pgvector

      - name: 初始化数据库（setup_db.py --graph）
        run: |
          # 向量侧必须成功（失败即非零退出）；AGE 缺失导致的图降级是预期行为。
          python setup_db.py --graph

      - name: 校验 schema 落库（扩展 / 表 / HNSW 索引 / 维度）
        run: python scripts/check_pg.py schema

      - name: 完整回归评测跑在 PG 上（读写走 pgvector）
        run: |
          python eval_run.py
          python scripts/check_baseline.py

      - name: 校验数据确实写入 PG（防止静默退回 memory）
        run: python scripts/check_pg.py data

