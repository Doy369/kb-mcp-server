name: CI

# 每次 PR / 主干推送都跑：单测 → 回归评测。
# 关键在最后一步——评测通过率低于基线时 CI 变红，**卡住合并**。
# 这样“我改完效果变好了”就不再是主观判断，而是流水线上的一个布尔值。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # 夜间跑「重口径」job（bge 真实嵌入：torch + 1.3GB 模型）。
  # 为什么不让它跟着每次推送跑：单次 CI 会从 ~40s 涨到数分钟，
  # 高频 job 一旦变慢就会被习惯性忽略 → 质量上限这条线改为低频但必跑。
  # 19:00 UTC = 次日 03:00 北京时间。
  schedule:
    - cron: "0 19 * * *"

jobs:
  test:
    name: 单测 + 回归评测（离线）
    runs-on: ubuntu-latest

    env:
      # 只装离线依赖：memory 后端 + dev 嵌入 + 确定性编排，零外部服务
      KB_STORAGE_BACKEND: memory
      KB_EMBEDDING_BACKEND: dev
      KB_GRAPH_BACKEND: memory
      KB_GRAPH_ENABLED: "1"
      KB_LLM_ENABLED: "0"
      KB_AGENT_MODE: deterministic
      KB_API_MOCK: "1"
      KB_AUDIT_LOG: "off"
      KB_CHUNK_STRATEGY: fine

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（仅离线必需项）
        run: |
          python -m pip install --upgrade pip
          # 不装 sentence-transformers —— 1.3GB 模型 + torch 会让单次 CI 从 11s 涨到数分钟。
          # 但仍要装 psycopg / pgvector 这两个**轻量客户端库**（无服务、无 torch，约 10MB）：
          # 存储层的注册顺序（必须先 CREATE EXTENSION 再 register_vector）是曾经
          # 真实踩坑的地方，装上真库才能让单测覆盖到真实代码路径而不是绕开导入。
          # 真实 Postgres 的端到端验证由专门的 pg job 负责。
          pip install pytest pydantic python-dotenv "mcp<2" numpy rank-bm25 "psycopg[binary]" pgvector

      # ------------------------------------------------------------------ #
      # 1) 单测：分层覆盖数据 / 检索 / 评测 / 护栏 / Agent / 降级
      # ------------------------------------------------------------------ #
      - name: 运行单测
        run: python -m pytest tests/ -v --tb=short

      # ------------------------------------------------------------------ #
      # 2) 回归评测：跑 golden 集，产出可对比的基线指标
      #    eval_run.py 自建独立 store，每次重新播种，结果可复现。
      # ------------------------------------------------------------------ #
      - name: 运行回归评测
        run: python eval_run.py

      - name: 校验评测基线（通过率不得低于阈值）
        run: python scripts/check_baseline.py

      # ------------------------------------------------------------------ #
      # 3) 归档产物：报告随 CI 运行留痕，便于事后对比与面试展示
      # ------------------------------------------------------------------ #
      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval_report.json
            kb_store_eval.json
          retention-days: 30
          if-no-files-found: warn

  # ------------------------------------------------------------------ #
  # 2) 容器镜像：构建 + 冒烟
  #
  # 为什么需要这一步：Dockerfile / docker-compose.yml 长期「已提交但从未构建过」
  # （开发机无 docker daemon，只做过 compose 语法校验）——「镜像能构建」一直是
  # 未验证假设。更关键的是 **docker build 成功 ≠ 容器能跑**：
  #   · build 只执行 pip install，不会 import 项目代码；
  #   · 缺依赖（如 rank_bm25）不会让 build 失败，而是让容器**启动后静默降级**。
  # 因此这里既构建、又真实启动并探活，还做一次容器内依赖自检。
  # ------------------------------------------------------------------ #
  docker:
    name: 容器镜像（构建 + 冒烟）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建镜像（默认轻量档）
        run: docker build -t kb-mcp-server:ci .

      - name: 启动容器并等待健康检查
        run: |
          docker run -d --name kb -p 8000:8000 kb-mcp-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "[OK] 容器健康检查通过（第 $i 次尝试）"
              exit 0
            fi
            sleep 2
          done
          echo "[FAIL] 容器 60s 内未就绪。容器状态："
          docker ps -a
          echo "---- 容器日志 ----"
          docker logs kb 2>&1 | tail -40
          exit 1

      - name: 探关键接口
        run: |
          echo "--- /healthz ---"
          curl -fsS http://127.0.0.1:8000/healthz; echo
          echo "--- /api/status ---"
          curl -fsS http://127.0.0.1:8000/api/status | head -c 400; echo

      - name: 容器内依赖自检（防止核心检索链路静默降级）
        run: |
          docker exec kb python -c "import rank_bm25, numpy, pypdf, mcp, pydantic, dotenv; print('[OK] 核心依赖齐备：rank_bm25 / numpy / pypdf / mcp / pydantic / dotenv')"

      - name: 容器内跑一次真实问答（端到端冒烟）
        run: |
          docker exec kb python -c "import urllib.request, json; req = urllib.request.Request('http://127.0.0.1:8000/api/ask', data=json.dumps({'question': '如何申请退货'}).encode(), headers={'Content-Type': 'application/json'}); d = json.loads(urllib.request.urlopen(req, timeout=30).read()); print('[OK] /api/ask 返回 confidence =', (d.get('confidence') or {}).get('score')); print('[OK] synthesis_method =', d.get('synthesis_method'))"

      - name: 失败时导出容器日志
        if: failure()
        run: docker logs kb 2>&1 | tail -50 || true

      - name: 清理容器
        if: always()
        run: docker rm -f kb || true

  # ------------------------------------------------------------------ #
  # 3) MCP 协议：真实 stdio 子进程 + 官方客户端完整握手
  #
  # 为什么需要这一步：此前的「MCP 工具」只被单测**直接 import 函数**调用——
  # 那是函数测试，不是协议验证。「这个 server 能被真实 MCP 客户端连上、
  # 握手、列出工具并调通」一直是未验证假设。本 job 起一个真实子进程，
  # 用 ClientSession 走完整 JSON-RPC（initialize → list_tools → call_tool），
  # 并验证 P2-9 动作工具确实产生了副作用（确认门 + 审计落盘）。
  #
  # 它同时回答一个定位问题：MCP 到底是标题还是实质——能不能被任意
  # MCP host（Claude Desktop / 自研 agent）直接接入。
  # ------------------------------------------------------------------ #
  mcp:
    name: MCP 协议（真实 stdio 端到端）
    runs-on: ubuntu-latest

    env:
      KB_STORAGE_BACKEND: memory
      KB_EMBEDDING_BACKEND: dev
      KB_GRAPH_BACKEND: memory
      KB_GRAPH_ENABLED: "1"
      KB_LLM_ENABLED: "0"
      KB_AGENT_MODE: deterministic
      KB_API_MOCK: "1"
      KB_AUDIT_LOG: "off"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（与单测 job 同口径）
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic python-dotenv "mcp<2" numpy rank-bm25 pypdf "psycopg[binary]" pgvector

      - name: MCP 协议端到端自检（含动作工具确认门与审计）
        run: python scripts/check_mcp.py

  # ------------------------------------------------------------------ #
  # 4) 生产存储：真实 Postgres + pgvector
  #
  # 为什么需要这一步：pgvector 后端长期只做到「代码就位」——从未在真实 PG 上
  # 跑过，因为开发机没有 docker daemon，起不了库。于是「生产存储能通」一直是
  # 未验证假设。这里用 service container 拉起 pgvector/pgvector:pg16，跑
  # setup_db.py 建表 + 完整回归评测，把假设变成流水线上的绿勾。
  #
  # 关键：光看「评测通过」不足以证明存储生效——存储连不上时代码会走降级分支，
  # 评测照样跑在 memory 上而 CI 全绿。所以最后两步专门校验 schema 落库、且
  # kb_chunks 里确有数据，把「静默退回」变成硬失败。
  #
  # 注：该镜像不含 Apache AGE，--graph 会按设计降级为 memory 图（不阻断，
  #     AGE 生产图的能力由本地带扩展的环境单独验证）。
  # ------------------------------------------------------------------ #
  pg:
    name: 生产存储（真实 PG + pgvector）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # 与 test job 唯一的区别：存储后端换成真实 PG
      KB_STORAGE_BACKEND: pgvector
      KB_DATABASE_URL: postgresql://kb:kb@localhost:5432/kb
      KB_EMBEDDING_DIM: "1024"
      KB_EMBEDDING_BACKEND: dev
      KB_GRAPH_BACKEND: memory
      KB_GRAPH_ENABLED: "1"
      KB_LLM_ENABLED: "0"
      KB_AGENT_MODE: deterministic
      KB_API_MOCK: "1"
      KB_AUDIT_LOG: "off"
      KB_CHUNK_STRATEGY: fine

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（含 PG 驱动）
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic python-dotenv "mcp<2" numpy rank-bm25 pypdf "psycopg[binary]" pgvector

      - name: 初始化数据库（setup_db.py --graph）
        run: |
          # 向量侧必须成功（失败即非零退出）；AGE 缺失导致的图降级是预期行为。
          python setup_db.py --graph

      - name: 校验 schema 落库（扩展 / 表 / HNSW 索引 / 维度）
        run: python scripts/check_pg.py schema

      - name: 完整回归评测跑在 PG 上（读写走 pgvector）
        run: |
          python eval_run.py
          python scripts/check_baseline.py

      - name: 校验数据确实写入 PG（防止静默退回 memory）
        run: python scripts/check_pg.py data

  # ------------------------------------------------------------------ #
  # 5) 负载测试：真实 HTTP 并发
  #
  # 为什么需要这一步：单测与回归评测都是**串行单请求**视角，证明不了
  # 「并发上来会不会串味 / 会不会丢数据 / 限流计数器会不会漏」。
  # 服务端是 ThreadingHTTPServer（线程真并发），内存里全是共享可变状态
  # （store / 限流桶 / 指标计数器）——这正是压测才照得出来的失效面。
  #
  # 断言不是「跑完没报错」，而是：零错误 + 响应字段完整 + **并发写入不丢数据**
  # （上报条数 == store 增量）+ **限流在并发下精确**（恰好放行 N 个）+
  # 指标计数不少于实际请求数。
  # ------------------------------------------------------------------ #
  load:
    name: 负载测试（真实 HTTP 并发）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（与单测 job 同口径）
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic python-dotenv "mcp<2" numpy rank-bm25 pypdf "psycopg[binary]" pgvector

      - name: 并发压测（同时起真实 app 子进程）
        run: python scripts/check_load.py

      - name: 失败时导出报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: load_report.json
          retention-days: 30
          if-no-files-found: warn

  # ------------------------------------------------------------------ #
  # 6) 图谱：真实 Apache AGE
  #
  # 为什么需要这一步：向量侧的 pgvector 早已在 CI 跑通，**图侧一直是空白**——
  # `pg` job 用的 pgvector 镜像不含 AGE，`setup_db.py --graph` 会按设计降级成
  # memory 图。于是 graph.py 里那句「生产启用前请在目标 AGE 版本上跑一遍验证」
  # 一直没有兑现，「AGE 图能用」始终是未验证假设。
  #
  # 这里用官方 `apache/age` 镜像（自带 shared_preload_libraries=age），
  # 跑 scripts/check_age.py：扩展 / 建图 / **不静默降级** / 真实摄取写入 /
  # 原始 ag_catalog 表对账 / Cypher 读回 / clear() 全链路。
  #
  # 注意本 job **不需要 pgvector**：图存储与向量存储是两套独立连接，
  # 所以不必为了「同库」去自建一个装两个扩展的镜像（那会让 CI 多花几分钟）。
  # ------------------------------------------------------------------ #
  age:
    name: 图谱（真实 Apache AGE）
    runs-on: ubuntu-latest

    services:
      age:
        image: apache/age:release_PG16_1.6.0
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # connect_timeout：连不上时快速失败，而不是把 job 挂在默认超时上
      KB_DATABASE_URL: postgresql://kb:kb@localhost:5432/kb?connect_timeout=10
      KB_GRAPH_BACKEND: age
      KB_GRAPH_NAME: kb_graph
      KB_GRAPH_ENABLED: "1"
      KB_STORAGE_BACKEND: memory
      KB_EMBEDDING_BACKEND: dev
      KB_LLM_ENABLED: "0"
      KB_AGENT_MODE: deterministic
      KB_API_MOCK: "1"
      KB_AUDIT_LOG: "off"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（与单测 job 同口径 + PG 驱动）
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic python-dotenv "mcp<2" numpy rank-bm25 pypdf "psycopg[binary]" pgvector

      - name: AGE 图侧真跑（扩展 / 建图 / 不降级 / 写入 / 原始表对账 / 读回 / 清理）
        run: python scripts/check_age.py

      - name: 失败时导出报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: age-report
          path: age_report.json
          retention-days: 30
          if-no-files-found: warn

  # ------------------------------------------------------------------ #
  # 7) bge 真实嵌入：质量上限（夜间 + 手动，不跟每次推送）
  #
  # 为什么单独一个 job 且不在推送时跑：bge 要装 torch + 下 1.3GB 模型，
  # 单次运行从 ~40s 涨到数分钟。高频 job 一旦变慢就会被习惯性忽略，
  # 反而比没有更糟。所以职责分离：
  #   · 推送时跑的快口径（dev 嵌入，阈值 0.72）——保「不许变差」；
  #   · 夜间的重口径（bge 嵌入，阈值 0.95）——保「质量上限」。
  # 两者共用 scripts/check_baseline.py，只是 KB_BASELINE_MIN 与报告路径不同。
  # ------------------------------------------------------------------ #
  bge:
    name: bge 真实嵌入（质量上限）
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    env:
      KB_STORAGE_BACKEND: memory
      KB_EMBEDDING_BACKEND: bge
      KB_GRAPH_BACKEND: memory
      KB_GRAPH_ENABLED: "1"
      KB_LLM_ENABLED: "0"
      KB_AGENT_MODE: deterministic
      KB_API_MOCK: "1"
      KB_AUDIT_LOG: "off"
      KB_CHUNK_STRATEGY: fine
      # 固定缓存位置，配合 actions/cache 免去每次夜跑重下 1.3GB
      HF_HOME: ${{ github.workspace }}/.hf_cache

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 缓存 HuggingFace 模型（bge-large-zh-v1.5 ≈ 1.3GB）
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf_cache
          key: hf-bge-large-zh-v1.5

      - name: 安装依赖（含 torch + sentence-transformers）
        run: |
          python -m pip install --upgrade pip
          pip install pydantic python-dotenv "mcp<2" numpy rank-bm25 pypdf sentence-transformers

      - name: bge 嵌入回归（报告写独立文件，不覆盖 dev 基线报告）
        run: python eval_run.py --embedding bge --out eval_report_bge.json

      - name: 校验 bge 口径基线（阈值 0.95）
        run: python scripts/check_baseline.py eval_report_bge.json
        env:
          KB_BASELINE_MIN: "0.95"
          # 报告文件名为 CI 专用，避免与本地评测产物混淆
          KB_EVAL_REPORT: eval_report_bge.json

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-bge
          path: eval_report_bge.json
          retention-days: 30
          if-no-files-found: warn


